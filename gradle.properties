# 工程级 Gradle 设置。
#
# 代理不要写在这里：Gradle、wrapper 都只读用户级的 ~/.gradle/gradle.properties，
# 那里已经配好了本机代理（127.0.0.1:7897）。
#
# 这台机器内存紧张（14 GB，交换区常满），堆给到 1536m 足够；
# 自动化构建由 scripts/*.sh 统一加 --no-daemon，避免常驻进程占着内存。

org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
